name: resume_builder
description: A Flutter Resume Builder App with editable templates.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.10.8
  printing: ^5.12.0
  image_picker: ^1.1.2
  extended_image: ^9.1.0
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.3
  google_fonts: ^6.2.1
  uuid: ^4.4.0
  flutter_animate: ^4.5.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  get_it: ^7.6.0
  go_router: ^13.2.0
  flutter_bloc: ^8.1.4
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.5
  injectable_generator: ^2.4.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_logo.png

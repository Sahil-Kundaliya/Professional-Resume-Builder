name: resume_builder
description: A Flutter Resume Builder App with editable templates.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  pdf: ^3.10.8
  printing: ^5.12.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  google_fonts: ^6.2.1
  uuid: ^4.4.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
